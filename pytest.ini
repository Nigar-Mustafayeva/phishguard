[pytest]
# Add the project root to sys.path so "import app" works when running the
# bare "pytest" command (not just "python -m pytest").
pythonpath = .
testpaths = tests
# Keep output clean. datetime.utcnow() triggers a 3rd-party DeprecationWarning
# via SQLAlchemy defaults; it does not affect correctness.
filterwarnings =
    ignore::DeprecationWarning
